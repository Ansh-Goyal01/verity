<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Verity mock checks</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#14161a;color:#f2efe8}li{padding:8px}.pass{color:#3dd68c}.fail{color:#ff6b6b}</style><h1>Verity mock data checks</h1><ol id="out"></ol><script src="mock-data.js"></script><script>
const root=document.getElementById('out'),m=window.VERITY_MOCKS;function check(label,ok,detail=''){const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS · ':'FAIL · ')+label+(detail?' — '+detail:'');root.append(li)}
function simulated(x,path='root'){if(!x||typeof x!=='object')return; if(Array.isArray(x)){x.forEach((v,i)=>simulated(v,path+'['+i+']'));return;}check(path+' has is_simulated true',x.is_simulated===true);for(const [k,v] of Object.entries(x))if(k!=='is_simulated')simulated(v,path+'.'+k)}
simulated(m);const starts={};m.scenario.vehicles.forEach(v=>starts[v.vehicle_id]=v.soc_pct);for(const [id,d] of Object.entries(m.dispatch)){if(id==='is_simulated')continue;let total=Number(d.starting_battery_pct);d.breakdown.forEach(t=>total+=Number(t.soc_pct));check(id+' starting battery + breakdown = arrival p50',Math.abs(total-d.arrival_soc.p50)<.001,`${total} = ${d.arrival_soc.p50}`);check(id+' bingo_line ordered by km',d.bingo_line.every((x,i,a)=>i===0||a[i-1].km<=x.km));}
</script></html>
