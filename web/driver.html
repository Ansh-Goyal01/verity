<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verity · Driver</title><link rel="stylesheet" href="../design/tokens.css"><link rel="stylesheet" href="css/driver.css"></head><body><header class="driverbar"><strong data-i18n="brand">VERITY · DRIVER RELEASE</strong><span id="sim" data-i18n="simulated" class="badge sim-badge" hidden>SIMULATED DATA</span><button id="theme" aria-label="Toggle theme">Dark</button></header><main><div id="state" class="state">Loading trip…</div><section id="trip" hidden><div class="metrics"><div><small data-i18n="battery">BATTERY</small><strong id="soc">—%</strong></div><div><small data-i18n="remaining">KM TO GO</small><strong id="km">—</strong></div><div><small id="marginLabel" data-i18n="above">ABOVE BINGO</small><strong id="margin">—</strong></div></div><div class="card routecard"><div class="routeheading"><span id="origin">Noida</span><span id="dest">Agra</span></div><div class="routebar"><div id="progress" class="progress"></div><div id="stopMarkers" class="stopmarkers"></div><div id="bingoDot" class="bingodot" title="Point of no return"></div><div id="driverDot" class="driverdot" title="Your position"></div></div><div class="routefoot"><span data-i18n="start">START</span><span data-i18n="ponr">POINT OF NO RETURN</span><span data-i18n="stop">STOP</span><span data-i18n="destination">DESTINATION</span></div></div><section class="card replay"><h2 class="section-header" data-i18n="replay">TRIP REPLAY</h2><div class="controls"><button id="play" data-i18n="play">Play</button><button id="pause" data-i18n="pause">Pause</button><label><span data-i18n="speed">Speed</span> <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20">20×</option></select></label><span id="replayStatus">Ready</span></div></section><section class="card entry"><div class="langrow"><h2 class="section-header" data-i18n="report">REPORT BATTERY</h2><button id="language" class="langtoggle" type="button">हिन्दी</button></div><div class="entryrow"><button id="mic" data-i18n="voice" aria-label="Record battery percentage">VOICE</button><input id="manual" inputmode="numeric" type="number" min="0" max="100" placeholder="%" aria-label="Battery percentage"><button id="submit" data-i18n="update">Update</button></div><div class="keypad" aria-label="Number keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="DEL" data-i18n="delete">DEL</button><button data-key="0">0</button><button data-key="OK" data-i18n="ok">OK</button></div><div id="entrymsg" class="state"></div></section><p class="safety" data-i18n="safety">Only use voice or the keypad when safely stopped, or let a passenger do it.</p></section></main><div id="alert" class="alert" hidden><div><span class="badge" data-i18n="divert">DIVERT NOW</span><h1 id="alertTitle">Divert</h1><p id="alertText"></p><button id="dismiss" data-i18n="understood">Understood</button></div></div><script src="js/snapshot.js"></script><script src="js/mock-data.js"></script><script src="js/api.js"></script><script src="js/driver.js"></script></body></html>
